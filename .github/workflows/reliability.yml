name: Transaction reliability
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    name: SQLite and PostgreSQL payment/security invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_test -d nexus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://nexus_test:isolated_test_only@localhost:5432/nexus_test
      BACKEND_AUTH_SECRET: ci-only-isolated-auth-secret-at-least-32-characters
      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""
      RAZORPAY_WEBHOOK_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            server/requirements.lock
            server/requirements-postgres.txt
      - run: pip install -r requirements.lock -r requirements-postgres.txt
      # Includes real processes, isolated schema migrations, signed webhook API
      # tests, ownership, policy, inventory and capture verification invariants.
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m benchmarks.intent_regression
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-isolated-session-secret-at-least-32-characters
      BACKEND_AUTH_SECRET: ci-only-isolated-auth-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
